# Production deployment workflow. Secrets are supplied by GitHub Actions.
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy.yml"

concurrency:
  group: opk-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: install
        name: Install dependencies
        run: npm install

      - id: cf
        name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 10; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 11; }
          npx wrangler d1 list --json > /tmp/d1-list.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/d1-list.json','utf8')); console.log('Cloudflare credentials OK')"

      - id: d1
        name: Resolve or create production D1
        run: |
          DB_ID=$(node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const db = rows.find(x => x.name === 'opk-db');
          process.stdout.write(db ? (db.uuid || db.id || '') : '');
          NODE
          )

          if [ -z "$DB_ID" ]; then
            echo "opk-db not found; creating it in APAC..."
            npx wrangler d1 create opk-db --location=apac
            npx wrangler d1 list --json > /tmp/d1-list.json
            DB_ID=$(node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const db = rows.find(x => x.name === 'opk-db');
          process.stdout.write(db ? (db.uuid || db.id || '') : '');
          NODE
            )
          fi

          test -n "$DB_ID" || { echo "Unable to resolve opk-db database_id"; exit 20; }
          echo "Resolved opk-db"
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - id: config
        name: Build production Wrangler config
        env:
          DB_ID: ${{ steps.d1.outputs.db_id }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          cfg.d1_databases[0].database_id = process.env.DB_ID;
          fs.writeFileSync('wrangler.deploy.jsonc', JSON.stringify(cfg, null, 2) + '\n');
          NODE

      - id: migrate
        name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

      - id: appsecrets
        name: Validate application secrets
        run: |
          missing=0
          for name in DASHBOARD_PASSWORD SESSION_SECRET API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - id: prepare
        name: Prepare Worker secrets file
        run: |
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('.deploy-secrets.json', JSON.stringify({
            DASHBOARD_PASSWORD: process.env.DASHBOARD_PASSWORD,
            SESSION_SECRET: process.env.SESSION_SECRET,
            API_KEY: process.env.API_KEY
          }));
          NODE
          chmod 600 .deploy-secrets.json

      - id: deploy
        name: Deploy Worker and Custom Domain
        run: npx wrangler deploy --config wrangler.deploy.jsonc --secrets-file .deploy-secrets.json

      - id: cleanup
        name: Remove temporary secrets file
        if: always()
        run: rm -f .deploy-secrets.json wrangler.deploy.jsonc

      - id: health
        name: Verify health endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://mes.fhkq.best/api/health

      - name: Publish non-secret deployment status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          CF_STATUS: ${{ steps.cf.outcome }}
          D1_STATUS: ${{ steps.d1.outcome }}
          CONFIG_STATUS: ${{ steps.config.outcome }}
          MIGRATE_STATUS: ${{ steps.migrate.outcome }}
          APPSECRETS_STATUS: ${{ steps.appsecrets.outcome }}
          PREPARE_STATUS: ${{ steps.prepare.outcome }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
          HEALTH_STATUS: ${{ steps.health.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const status = {
            recorded_at: new Date().toISOString(),
            run_id: process.env.GITHUB_RUN_ID,
            source_sha: process.env.GITHUB_SHA,
            job: process.env.JOB_STATUS || 'unknown',
            steps: {
              install: process.env.INSTALL_STATUS || 'not_run',
              cloudflare_credentials: process.env.CF_STATUS || 'not_run',
              d1: process.env.D1_STATUS || 'not_run',
              config: process.env.CONFIG_STATUS || 'not_run',
              migration: process.env.MIGRATE_STATUS || 'not_run',
              application_secrets: process.env.APPSECRETS_STATUS || 'not_run',
              prepare_secrets: process.env.PREPARE_STATUS || 'not_run',
              deploy: process.env.DEPLOY_STATUS || 'not_run',
              health: process.env.HEALTH_STATUS || 'not_run'
            }
          };
          fs.writeFileSync('.deploy-status.json', JSON.stringify(status, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status.json
          git diff --cached --quiet || git commit -m "Record deployment status"
          git push
