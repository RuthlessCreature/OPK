name: opk-api-command

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".opk-command.json"
      - ".github/workflows/opk-api-command.yml"

permissions:
  contents: write

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Execute OPK API command
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const BASE = 'https://mes.fhkq.best';
          const cmd = JSON.parse(fs.readFileSync('.opk-command.json', 'utf8'));
          const method = String(cmd.method || 'GET').toUpperCase();
          const path = String(cmd.path || '');
          if (!['GET','POST','PATCH','DELETE'].includes(method)) throw new Error('Unsupported method');
          if (!/^\/api\/v1\//.test(path) && path !== '/api/health') throw new Error('Path outside OPK API');
          const headers = { 'content-type': 'application/json' };
          const options = { method, headers };
          if (cmd.body !== undefined && method !== 'GET' && method !== 'DELETE') options.body = JSON.stringify(cmd.body);
          const res = await fetch(BASE + path, options);
          const text = await res.text();
          let parsed;
          try { parsed = text ? JSON.parse(text) : null; } catch { parsed = { raw: text }; }
          const out = {
            executed_at: new Date().toISOString(),
            request_id: cmd.request_id || null,
            method,
            path,
            http_status: res.status,
            ok: res.ok,
            response: parsed
          };
          fs.writeFileSync('.opk-command-result.json', JSON.stringify(out, null, 2) + '\n');
          console.log(JSON.stringify(out, null, 2));
          if (!res.ok) process.exitCode = 20;
          NODE

      - name: Publish non-secret API result
        if: always()
        run: |
          if [ -f .opk-command-result.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .opk-command-result.json
            git diff --cached --quiet || git commit -m "Record OPK API command result"
            git push
          fi
