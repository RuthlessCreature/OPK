name: sync-opk-self

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-opk-self.yml"
  pull_request:
    paths:
      - ".opk-sync-trigger"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    env:
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Upsert OPK self project via production API
        run: |
          test -n "$API_KEY" || { echo "Missing API_KEY"; exit 10; }
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const BASE = 'https://mes.fhkq.best';
          const headers = {
            'authorization': `Bearer ${process.env.API_KEY}`,
            'content-type': 'application/json'
          };

          async function api(path, method='GET', body) {
            const res = await fetch(BASE + path, {
              method,
              headers,
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await res.text();
            let data;
            try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
            if (!res.ok) {
              console.error(method, path, res.status, JSON.stringify(data));
              process.exit(20);
            }
            return data;
          }

          const projectName = 'OPK 一人公司项目进度看板';
          const projectPatch = {
            name: projectName,
            description: '一人公司项目进度管理看板。Cloudflare Workers + D1 + Vanilla Web 前端，支持项目、里程碑、问题、状态、备注及第三方/LLM REST API。',
            status: 'active',
            priority: 'high',
            start_date: '2026-08-18',
            due_date: null,
            next_action: '把现有项目和待办逐步同步进 OPK；后续对话中明确提出项目 CRUD/状态操作时，通过 OPK API 实际执行并返回真实结果。',
            notes: '2026-08-19 状态同步：v0.1 已合并 main；GitHub CI 已通过；Cloudflare 凭证验证、D1 opk-db、migration、Worker 部署、自定义域名 mes.fhkq.best、/api/health 均已成功。生产 Secret 由 GitHub Environment 管理。'
          };

          const found = await api('/api/v1/projects?q=' + encodeURIComponent('OPK'));
          const candidates = Array.isArray(found.data) ? found.data : [];
          let project = candidates.find(x => x.name === projectName) || candidates.find(x => /opk/i.test(x.name || ''));
          if (project) {
            const updated = await api(`/api/v1/projects/${encodeURIComponent(project.id)}`, 'PATCH', projectPatch);
            project = updated.data;
          } else {
            const created = await api('/api/v1/projects', 'POST', projectPatch);
            project = created.data;
          }

          const milestonesWanted = [
            { title: '需求与架构定义', status: 'done', sort_order: 10, notes: '确定极简一人公司看板：项目、里程碑、问题、状态、备注；无用户/角色体系。' },
            { title: 'v0.1 前后端开发', status: 'done', sort_order: 20, notes: 'Worker REST API、D1 数据模型、Vanilla HTML/CSS/JS 前端、OpenAPI 已完成。' },
            { title: 'GitHub CI 与 main 发布', status: 'done', sort_order: 30, notes: 'CI 语法、OpenAPI、SQLite migration、Wrangler dry-run 均验证通过并合并 main。' },
            { title: 'Cloudflare D1 / Worker / 域名上线', status: 'done', sort_order: 40, notes: '生产部署 run 32156464027 全部成功，包含 D1、migration、Worker、自定义域名和健康检查。' },
            { title: '对话驱动 OPK API 操作链路', status: 'done', sort_order: 50, notes: '已通过 GitHub Environment 中的 API_KEY 调用生产 OPK REST API；后续明确 CRUD 请求按真实 API 执行并返回结果。' },
            { title: '同步现有项目与待办', status: 'in_progress', sort_order: 60, notes: '下一阶段逐步把当前业务项目、待办和进度迁移到 OPK。' }
          ];

          const msResp = await api(`/api/v1/projects/${encodeURIComponent(project.id)}/milestones`);
          const existing = Array.isArray(msResp.data) ? msResp.data : [];
          for (const wanted of milestonesWanted) {
            const hit = existing.find(x => x.title === wanted.title);
            if (hit) {
              await api(`/api/v1/milestones/${encodeURIComponent(hit.id)}`, 'PATCH', wanted);
            } else {
              await api(`/api/v1/projects/${encodeURIComponent(project.id)}/milestones`, 'POST', wanted);
            }
          }

          const detail = await api(`/api/v1/projects/${encodeURIComponent(project.id)}`);
          const d = detail.data;
          const result = {
            synced_at: new Date().toISOString(),
            api: BASE,
            project: {
              id: d.id,
              name: d.name,
              status: d.status,
              priority: d.priority,
              start_date: d.start_date,
              due_date: d.due_date,
              next_action: d.next_action,
              notes: d.notes
            },
            milestones: (d.milestones || []).map(m => ({ id: m.id, title: m.title, status: m.status, sort_order: m.sort_order })),
            open_issues: (d.issues || []).filter(i => !['resolved','closed'].includes(i.status)).map(i => ({ id: i.id, title: i.title, status: i.status, severity: i.severity }))
          };
          fs.writeFileSync('.opk-self-sync-result.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Publish non-secret sync result
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .opk-self-sync-result.json
          git diff --cached --quiet || git commit -m "Record OPK self sync result"
          git push
